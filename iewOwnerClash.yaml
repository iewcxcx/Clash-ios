      - 🇨🇭 瑞士自动
      - 🇳🇱 荷兰自动
      - 🇨🇦 加拿大自动
      - 🇷🇺 俄罗斯自动
      - DIRECT
  - name: 🖥️ 全局订阅
    type: select
    include-all: true
  - name: ⚡ 自动测速
