mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
ipv6: false

tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - 'any:53'

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 默认国外/未知域名：强制走代理加密 DoH
  nameserver:
    - https://dns.cloudflare.com/dns-query#🚀 代理总控
    - https://dns.google/dns-query#🚀 代理总控

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 精简政策：只保留极其稳定的 cn 规则，保证国内软件秒开
  nameserver-policy:
    'geosite:cn':
      - 223.5.5.5
      - 119.29.29.29

  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - '*.msidentity.com'
    - captive.apple.com
    - '*.push.apple.com'
    - +.weixin.com
    - +.wechat.com
    - +.qq.com
    - +.tencent.com
    - speedtest.net

profile:
  store-selected: true
  store-fake-ip: true

proxy-groups:
  - name: 🚀 代理总控
    type: select
    proxies:
