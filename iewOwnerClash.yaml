      - ⚡ 自动测速
      - 🔔 苹果推送
      - 🇯🇵 日本自动
      - 🇸🇬 新加坡自动
      - 🇹🇼 台湾自动
      - 🇭🇰 香港自动
      - 🇺🇸 美国自动
      - 🇬🇧 英国自动
      - 🇲🇴 澳门自动
      - 🇰🇷 韩国自动
      - 🇹🇭 泰国自动
      - 🇻🇳 越南自动
      - 🇩🇪 德国自动
